[package]
name = "xink"
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
description = "Local-first Markdown notes desktop app built with GPUI"
license = "MIT"

# 本项目的 `tests/` 只是**单元测试的物理存放目录**（由 src 里的 `#[path]` 挂载），
# 不是 Cargo 的集成测试目录——xink 是 bin crate，没有 lib target，
# 顶层 `tests/*.rs` 会被当成独立集成测试 crate 去链接 xink 而必然失败。
# 关掉自动发现，避免将来有人在 tests/ 根目录落文件时踩坑。
autotests = false

[[bin]]
name = "xink"
path = "src/main.rs"

[dependencies]
# 唯一直接依赖。gpui-kit 内部 pin gpui-pre 0.3.9 并 re-export GPUI。
# 禁止直接依赖 crates.io 上的 gpui 0.2.2（与 gpui-pre 0.3.x 不兼容）。
#
# features：编辑区语法高亮依赖 tree-sitter，且语言是按需编译的。
# json / yaml / toml 对应"数据文件编辑"需求（见 docs/json-yaml-editing-design.md）；
# markdown 对应"编辑区 Markdown 语法高亮"，同时让 ```json / ```yaml 这类围栏
# 代码块通过 tree-sitter injection 在编辑区着色。
# 代价是首次编译要编译 C 语法源码（分钟级）。
# 未启用某门语言时 `set_highlighter` 会**静默**退化为纯文本，不报错、无提示。
# JSON 语法随 `tree-sitter` 自带（gpui-component 把它列在 tree-sitter 的默认依赖里），
# gpui-kit 没有单独的同名 feature；YAML / TOML / MARKDOWN 才需要显式开启。
gpui-kit = { version = "0.8", features = [
    "tree-sitter",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-markdown",
] }

# 版本与 gpui-base 内部保持一致，避免同一 crate 多版本共存
ropey = "=2.0.0-beta.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# dirs 6 / notify 8：与 gpui-kit 0.8 依赖树里的版本一致（rust-embed→shellexpand
# 用 dirs 6、gpui-component 用 notify 8.2），升级后各自合并成一份。
# 注意不要跟着升到 dirs 7 / notify 9：那会重新多出一份。
dirs = "6"
notify = "8"
regex = "1"
# 滚动同步：预览区按"顶层块"划分，锚点解析必须与预览解析同源，
# 因此用 gpui-base 内部同一个 markdown（1.0）来取每个块的源行区间。
# 版本一致，Cargo 会合并成一份，不会引入第二份解析库。
markdown = "1.0"
# 文件监听事件通过 flume 传给 UI，避免定时轮询。
# 0.12 与 gpui-pre-scheduler 内部版本一致，只解析出一份。
flume = "0.12"
libc = "0.2"

# 强制图标资源内嵌到二进制（含 debug 构建）。
#
# gpui-kit-assets 用 rust-embed 提供 `IconName` 的 SVG；rust-embed 默认只在
# **release** 内嵌，debug 构建会按编译期记录的绝对路径（…/gpui-kit-assets-x.y.z/assets）
# 在运行时读盘——把 debug 产物的 .app 拷到别的机器就会因路径不存在而图标全丢。
# Cargo 会对同一版本的 rust-embed 做特性合并，因此这里开启 debug-embed 即可让
# 依赖方的图标在任何构建模式下都内嵌。版本需与 gpui-kit-assets 内部一致（8.x）。
rust-embed = { version = "8.13", features = ["debug-embed"] }

# Markdown 代码块语法高亮。版本与 gpui-component 内部保持一致。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
# AI 能力：阻塞式 HTTP，跑在后台线程（规则 02 §6）。
# 3.x 是当前活跃维护线；只开 rustls + json，避免拉进 native-tls 与 cookie 等。
# 传递依赖（rustls / flate2 / base64 / log / libc …）大多已在 Cargo.lock 中存在单份，
# 实测全新 release 编译 12.8s（大头是 ring），见 docs/ai/ollama-provider-design.md §2.6。
ureq = { version = "3", features = ["rustls", "json"] }

# 数据文件（JSON / YAML / TOML）解析与格式化预览。
#
# YAML 选 `noyalib`：`serde_yaml`（0.9.34+deprecated）与 `serde_yml`
# （0.0.13 起只是转发到 noyalib 的兼容壳）均已废弃。noyalib 是纯 Rust、
# `#![forbid(unsafe_code)]` 的接替者，API 与 serde_yaml 同形。
noyalib = "0.0.58"
# 与 Cargo.lock 中已有的 0.8.23 对齐，避免解析出第二份 toml
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
taffy = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
